<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo Inclinacion Movil</title>
</head>
<body>
    <style>
        body
        {
            background-color: rgb(173, 173, 241);
        }

        #aceptar
        {
            background-color: white;
            color: black;
            border-radius: 5%;
        }

        #caja
        {
            background-color: rgb(255, 211, 146);
            width: 500px;
            height: 500px;

            margin-top: 100px;
        }

    </style>

    <button id="aceptar">Empezar animacion Orientacion</button>

    <div id="caja">s</div>

    <script>

        let boton = document.getElementById("aceptar");

        let caja = document.getElementById("caja");

        caja.innerHTML = " ";

        boton.addEventListener("click",onClick);

        function onClick() {
            if (typeof DeviceMotionEvent.requestPermission === 'function') {
                // Handle iOS 13+ devices.
                DeviceMotionEvent.requestPermission()
                .then((state) => {
                    if (state === 'granted') 
                    {
                        window.addEventListener('devicemotion', mostrarCoordenadas);
                    } 
                    else 
                    {
                        console.error('Request to access the orientation was rejected');
                    }
                })
                .catch(console.error);
            } 
            else 
            {
                // Handle regular non iOS 13+ devices.
                window.addEventListener('devicemotion', mostrarCoordenadas);
            }
        }

        function mostrarCoordenadas(e)
        {
            caja.innerHTML = "X: "+e.beta+" , Y: "+e.alpha+" ";
        }

    </script>
</body>
</html>
